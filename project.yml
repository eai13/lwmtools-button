:paths:
  :source:
    - src/**
  :include:
    - src/**
  :test:
    - test/**

:project:
  :build_root: ceedling-test-build/

# Plugins
:plugins:
  :enabled:
    - gcov
    # - command_hooks

# Coverage report
:gcov:
  :utilities:
    - gcovr
  :reports:
    - HtmlDetailed
    - Text
    - Cobertura
  :gcovr:
    :html_medium_threshold: 75
    :html_high_threshold: 90
    :html_title: "coverage report"
    :report_exclude:
      - ".*/unity\\.c$"
      - ".*/cmock\\.c$"

